<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0c0e" />
    <meta name="description" content="Réservez une salle ou un véhicule et invitez vos collègues — synchronisé avec Outlook et Teams." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Réza · Réservations</title>
    <script>
      // Thème sombre par défaut ; le choix « clair » de l'utilisateur est mémorisé.
      (function () {
        try {
          if (localStorage.getItem("reza.theme") === "light") document.documentElement.classList.remove("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
