<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="Réservez une salle ou un véhicule et invitez vos collègues en quelques secondes — synchronisé avec Outlook et Teams." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Réza · Réservations</title>
    <script>
      // Applique le thème avant le premier rendu pour éviter le flash.
      (function () {
        try {
          var t = localStorage.getItem("reza.theme");
          var dark = t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
